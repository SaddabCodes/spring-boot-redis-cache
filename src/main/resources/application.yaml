spring:
  application:
    name: spring-boot-redis-cache

# database configuration
  datasource:
    url: jdbc:mysql://localhost:3306/spring_boot_redis_cache
    username: root
    password: 1234

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

# redis cache configuration
  data:
    redis:
      host: localhost
      url: redis://localhost:6379

